draft: true
Name: CoWork
short-description: Dual-module sample sequencer — two linked Computers play MIDI-file songs through your own sounds
summary: >-
  CoWork turns one or two Workshop Computers into a sample groovebox driven
  by your own MIDI files and sounds. One module plays melodic parts (a
  duophonic lead, a 3-voice chord pad and a mono bass, with v/oct and gate
  outputs), the other percussive parts (a 16-pad drum kit with trigger
  outputs). Link the two front-panel USB ports
  and one module leads, sending MIDI clock and transport, while the other
  follows sample-locked — or sync the follower to any DAW's USB MIDI clock.
  Songs and samples are prepared and uploaded from a browser-based manager
  over USB. Works on 2 MB cards, shines on 16 MB.
Language: C++ (Pico SDK / ComputerCard)
Creator: Phil Millman
Version: "0.1.0"
Status: WIP
License: MIT
