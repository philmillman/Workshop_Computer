uf2:
  - path: UF2/cowork.uf2
    name: CoWork v0.1.0 (2 MB and 16 MB cards)

panel:
  inputs:
    - id: AudioIn1
      name: Reserved
      type: audio
      description: Reserved for future FX processing
    - id: CVIn1
      name: CV Forward 1
      type: cv
      description: Forwarded to the linked module over USB as 14-bit MIDI pitch bend; the peer can route it to its own CV outputs
    - id: CVIn2
      name: CV Forward 2
      type: cv
      description: Forwarded to the linked module over USB as 14-bit MIDI pitch bend
    - id: PulseIn1
      name: Trigger Forward 1
      type: pulse
      description: Edges forwarded to the linked module as MIDI notes; the peer can route them to its pulse outputs
    - id: PulseIn2
      name: Trigger Forward 2
      type: pulse
      description: Edges forwarded to the linked module as MIDI notes
  outputs:
    - id: AudioOut1
      name: Lead+Pad / Kit Mix
      type: audio
      description: Melodic mode - lead and pad mix; percussive mode - full drum kit mix
    - id: AudioOut2
      name: Bass / Submix
      type: audio
      description: Melodic mode - bass instrument mix; percussive mode - configurable lane submix (default kick)
    - id: CVOut1
      name: Lead v/oct / Accent
      type: cv
      description: Melodic mode - calibrated v/oct of the lead part; percussive mode - accent (last-hit velocity)
    - id: CVOut2
      name: Bass v/oct / Velocity
      type: cv
      description: Melodic mode - calibrated v/oct of the bass part; percussive mode - velocity CV of a chosen drum lane
    - id: PulseOut1
      name: Lead Gate / Kick Trig
      type: pulse
      description: Melodic mode - lead gate; percussive mode - 10 ms trigger from a configurable lane (default kick)
    - id: PulseOut2
      name: Bass Gate / Snare Trig
      type: pulse
      description: Melodic mode - bass gate; percussive mode - 10 ms trigger from a configurable lane (default snare)

controls:
  switch:
    up:
      name: Leader (at boot)
      description: Power up with the switch up to make this module the clock leader — it sends MIDI clock, start and stop over the USB link. After boot, the up position selects X/Y knob page 2 (output source, solo)
    middle:
      name: Follower (at boot)
      description: Power up with the switch in the middle to follow received MIDI clock from the linked module or any DAW. After boot, the middle position selects X/Y knob page 1 (decay, note probability)
    down:
      name: Engine Toggle (hold)
      description: Hold about one second to toggle between the melodic engine (lead + bass) and the percussive engine (drum kit)
    tap:
      name: Transport / Next Song
      description: A single tap starts or stops the transport (leader; on a follower with no clock source it starts the internal clock). A double tap advances to the next loaded song, skipping empty slots — while running the change lands at the loop point
  knobs:
    - main:
        name: Loop Roll
        description: Loops the playing sequence — counterclockwise to clockwise 1/4 beat (16th-note ratchet), 1/2 beat, 1 beat, 2 beats, 1 bar, 2 bars, 4 bars, 8 bars; fully clockwise = no looping. The song position (and the leader's clock output) keeps running underneath, so releasing the roll drops back in where the song would have been
      x:
        name: Decay / Output Source
        description: Page 1 (switch middle) — decay. Melodic engine - shortens the configured lead, bass and pad releases (fully clockwise = as configured); percussive engine - adds a decay to each hit, about 10 ms to 640 ms (fully clockwise = one-shots play out). Which parts respond is set in the web editor. Page 2 (switch up) — output source. Counterclockwise half - this module's own notes on all CV and pulse outputs; clockwise half - the peer module's forwarded CV and pulse inputs. Tempo always follows the song's MIDI tempo map
      y:
        name: Note Probability / Solo
        description: Page 1 (switch middle) — note probability. The chance that each sequenced note plays, fully clockwise = every note, fully counterclockwise = none; which parts respond is set in the web editor. Page 2 (switch up) — solo. Lower third - CV/pulse pair 1 only (pair 2 muted), middle - both, upper third - pair 2 only. Master volume is set in the web editor
  leds:
    - display: list
      items:
        - id: led0
          name: Role
          description: Solid = leader; slow blink = follower locked; fast blink = follower waiting for clock; double-blink = both modules are set to leader
        - id: led1
          name: Link
          description: On when the USB MIDI link (module or DAW) is up; flickers during web-manager uploads
        - id: led2
          name: Engine
          description: Off = melodic, on = percussive
        - id: led3
          name: Transport
          description: On while running
        - id: led4
          name: Beat
          description: Pulses each quarter note, brighter on the downbeat
        - id: led5
          name: Activity
          description: Brightness follows voice activity; latches solid if the audio callback ever overruns (debug aid)

host:
  notes: |
    The web manager (Chromium browsers, Web Serial) uploads MIDI files and
    samples and edits configuration. Connect the module directly to the
    computer — the module-to-module link uses the same USB port, so unplug
    the other Computer first. USB host mode (needed on ONE side of a
    two-module link) requires a 2025 rev 1.1 Computer; the USB port role
    settles when power is first applied, so re-cable then power-cycle.
